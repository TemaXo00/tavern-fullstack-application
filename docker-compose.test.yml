services:
  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: tavern-test-rmq
    networks:
      - tavern
    ports:
      - "${TAVERN_RMQ_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${TAVERN_RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TAVERN_RMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.5-alpine
    container_name: tavern-test-redis
    networks:
      - tavern
    ports:
      - "${TAVERN_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
      --requirepass ${TAVERN_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18.4-alpine
    container_name: tavern-test-auth-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_AUTH_DB_NAME}
      POSTGRES_USER: ${TAVERN_AUTH_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_AUTH_DB_PASSWORD}
    ports:
      - "${TAVERN_AUTH_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_AUTH_DB_USER} -d ${TAVERN_AUTH_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_data:/var/lib/postrgesql

  profile-db:
    image: postgres:18.4-alpine
    container_name: tavern-test-profile-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_PROFILE_DB_NAME}
      POSTGRES_USER: ${TAVERN_PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_PROFILE_DB_PASSWORD}
    ports:
      - "${TAVERN_PROFILE_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_PROFILE_DB_USER} -d ${TAVERN_PROFILE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - profile_db_data:/var/lib/postrgesql

  auth-service:
    image: tavern/auth:latest
    container_name: tavern-test-auth-api
    networks:
      - tavern
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_PROFILE_CACHE_TTL: ${TAVERN_PROFILE_CACHE_TTL}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  profile-service:
    image: tavern/profile:latest
    container_name: tavern-test-profile-api
    networks:
      - tavern
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_REPUTATION_SCORE_EVENT: ${TAVERN_REPUTATION_SCORE_EVENT}
      TAVERN_REPUTATION_SCORE_BLOCK: ${TAVERN_REPUTATION_SCORE_BLOCK}
      TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK: ${TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK}
      TAVERN_REPUTATION_SCORE_REPORT: ${TAVERN_REPUTATION_SCORE_REPORT}
    depends_on:
      auth-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: tavern/gateway:latest
    container_name: tavern-test-gateway-api
    ports:
      - "3000:3000"
    networks:
      - tavern
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
    depends_on:
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      redis:
        condition: service_healthy
      auth-db:
        condition: service_healthy

  db_migrator:
    image: tavern/migrator:latest
    container_name: tavern-test-database-migrator
    networks:
      - tavern
    environment:
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_URL}
    depends_on:
      auth-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
    restart: "no"

volumes:
  redis_data:
  auth_db_data:
  profile_db_data:

networks:
  tavern:
    driver: bridge
