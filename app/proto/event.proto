syntax = 'proto3';

import 'event/tag.proto';
import 'shared/shared.proto';

package event;

service TagService {
    rpc GetPaginatedTags(tag.GetPaginatedTagsInput) returns (tag.PaginatedTagsOutput);
    rpc GetTagBySlug(tag.GetTagInput) returns (tag.TagDetailedOutput);
    rpc CreateTag(tag.CreateTagInput) returns (tag.TagOutput);
    rpc UpdateTag(tag.UpdateTagInput) returns (tag.TagOutput);
    rpc DeleteTag(tag.DeleteTagInput) returns (shared.Empty);
}
