syntax = 'proto3';

import 'event/tag.proto';
import 'event/events.proto';
import 'shared/shared.proto';

package event;

service TagService {
    rpc GetPaginatedTags(tag.GetPaginatedTagsInput) returns (tag.PaginatedTagsOutput);
    rpc GetTagBySlug(tag.GetTagInput) returns (tag.TagDetailedOutput);
    rpc CreateTag(tag.CreateTagInput) returns (tag.TagOutput);
    rpc UpdateTag(tag.UpdateTagInput) returns (tag.TagOutput);
    rpc DeleteTag(tag.DeleteTagInput) returns (shared.Empty);
}

service EventService {
    rpc GetPublicEvents(events.PaginatedPublicEventsInput) returns (events.PaginatedPublicEventsOutput);
    rpc GetPrivateEvents(events.PaginatedPrivateEventsInput) returns (events.PaginatedPrivateEventsOutput);
    rpc GetMyEvents(events.PaginatedPrivateEventsInput) returns (events.PaginatedPrivateEventsOutput);
    rpc GetPublicUserEvents(events.GetPublicUserEventsInput) returns (events.PaginatedPublicEventsOutput);
    rpc GetPrivateUserEvents(events.GetPrivateUserEventsInput) returns (events.PaginatedPrivateEventsOutput);
    rpc GetPublicEventBySlug(events.PublicGetEventBySlugInput) returns (events.EventOutput);
    rpc GetPrivateEventBySlug(events.PrivateGetEventBySlugInput) returns (events.EventOutput);
    rpc GetMyEventBySlug(events.PrivateGetEventBySlugInput) returns (events.EventOutput);
    rpc CreateEvent(events.CreateEventInput) returns (events.EventMethodsOutput);
    rpc PublishEvent(events.PublishEventInput) returns (events.EventMethodsOutput);
    rpc CancelEvent(events.CancelEventInput) returns (events.EventMethodsOutput);
    rpc FinishEvent(events.FinishEventInput) returns (events.EventMethodsOutput);
    rpc SwitchOrganizer(events.SwitchOrganizerInput) returns (events.EventMethodsOutput);
    rpc UpdateEvent(events.UpdateEventDataInput) returns (events.EventMethodsOutput);
    rpc DeleteEvent(events.DeleteEventInput) returns (shared.Empty);
    rpc DeleteOtherEvent(events.DeleteOtherEventInput) returns (shared.Empty);
}
