syntax = 'proto3';

package reputation;

enum Actions {
    EVENT = 0;
    REPORT = 1;
    BLOCK = 2;
    EARLY_UNBLOCK = 3;
    CUSTOM = 4;
}

// Input Messages

message ValidateInput {
  string accessToken = 1;
  SessionInput session = 2;
}

message SessionInput {
    string os = 1;
    string device = 2;
    string browser = 3;
    string ip = 4;
}

message PaginationInput {
    optional int32 page = 1;
    optional int32 limit = 2;
    optional string search = 3;
    optional Actions action = 4;
}

message GetMyReputationInput {
    ValidateInput validation = 1;
    PaginationInput pagination = 2;
}

message GetReputationByNicknameInput {
    string nickname = 1;
    PaginationInput pagination = 2;
}

message AddReputationInput {
    string nickname = 1;
    int32 score = 2;
    string message = 3;
}

// Output Messages

message PaginationOutput {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
    int32 totalPages = 4;
    bool hasNext = 5;
    bool hasPrev = 6;
    optional string search = 7;
    optional Actions action = 8;
}

message ReputationOutput {
    Actions action = 1;
    string message = 2;
    int32 score = 3;
    string createdAt = 4;
}

message PaginatedReputationOutput {
    PaginationOutput pagination = 1;
    repeated ReputationOutput reputationLogs = 2;
}
