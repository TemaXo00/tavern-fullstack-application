syntax = 'proto3';

package participant;

enum EventStatus {
    DRAFT = 0;
    PUBLISHED = 1;
    CANCELLED = 2;
    FINISHED = 3;
}

enum ParticipantStatus {
    WAITLIST = 0;
    RECORDED = 1;
    FIXED = 2;
    NOT_COME = 3;
}

// Input Messages

message ValidateInput {
  string accessToken = 1;
  SessionInput session = 2;
}

message SessionInput {
    string os = 1;
    string device = 2;
    string browser = 3;
    string ip = 4;
}

message EventPaginationInput {
    optional int32 page = 1;
    optional int32 limit = 2;
    optional string search = 3;
    optional EventStatus status = 4;
}

message ParticipantPaginationInput {
    optional int32 page = 1;
    optional int32 limit = 2;
    optional string search = 3;
    optional ParticipantStatus status = 4;
}

message GetUserEventsInput {
    string nickname = 1;
    EventPaginationInput pagination = 2;
}

message GetMyEventsInput {
    ValidateInput validation = 1;
    EventPaginationInput pagination = 2;
}

message GetEventParticipantsInput {
    string slug = 1;
    ParticipantPaginationInput pagination = 2;
}

message JoinEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message LeaveEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message AddUserToEventInput {
    ValidateInput validation = 1;
    string slug = 2;
    string nickname = 3;
}

message ChangeUserStatusInput {
    ValidateInput validation = 1;
    string slug = 2;
    string nickname = 3;
    ParticipantStatus status = 4;
}

message RemoveUserFromEventInput {
    ValidateInput validation = 1;
    string slug = 2;
    string nickname = 3;
}

// Output messages

message EventPaginationOutput {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
    int32 totalPages = 4;
    bool hasNext = 5;
    bool hasPrev = 6;
    optional string search = 7;
    optional EventStatus status = 8;
}

message ParticipantPaginationOutput {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
    int32 totalPages = 4;
    bool hasNext = 5;
    bool hasPrev = 6;
    optional string search = 7;
    optional ParticipantStatus status = 8;
}

message EventOutput {
    string slug = 1;
    string name = 2;
    string dateAndTime = 3;
    EventStatus status = 4;
}

message ParticipantOutput {
    string nickname = 1;
    string eventId = 2;
    optional string avatarId = 3;
    bool isFixed = 4;
    optional string note = 5;
    ParticipantStatus status = 6;
}

message ParticipantInPaginatedOutput {
    string nickname = 1;
    string userId = 2;
    optional string avatarId = 3;
}

message PaginatedEventParticipantsOutput {
    EventOutput event = 1;
    ParticipantPaginationOutput pagination = 2;
    repeated ParticipantOutput participants = 3;
}

message PaginatedParticipatedEventsOutput {
    ParticipantInPaginatedOutput participant = 1;
    EventPaginationOutput pagination = 2;
    repeated EventOutput events = 3;
}
