syntax = "proto3";

package events;

enum EventStatuses {
    DRAFT = 0;
    PUBLISHED = 1;
    CANCELLED = 2;
    FINISHED = 3;
}

// Input Messages

message ValidateInput {
  string accessToken = 1;
  SessionInput session = 2;
}

message SessionInput {
    string os = 1;
    string device = 2;
    string browser = 3;
    string ip = 4;
}

message PublicPaginationInput {
    optional int32 page = 1;
    optional int32 limit = 2;
    optional string search = 3;
    optional string dateFrom = 4;
    optional string dateTo = 5;
    optional int32 leftPlacesFrom = 6;
    optional int32 leftPlacesTo = 7;
    repeated string tags = 8;
}

message PrivatePaginationInput {
    optional int32 page = 1;
    optional int32 limit = 2;
    optional string search = 3;
    optional string dateFrom = 4;
    optional string dateTo = 5;
    optional int32 totalPlacesFrom = 6;
    optional int32 totalPlacesTo = 7;
    optional int32 leftPlacesFrom = 8;
    optional int32 leftPlacesTo = 9;
    optional EventStatuses status = 10;
    repeated string tags = 11;
}

message PaginatedPublicEventsInput {
    PublicPaginationInput pagination = 1;
}

message PaginatedPrivateEventsInput {
    ValidateInput validation = 1;
    PrivatePaginationInput pagination = 2;
}

message GetPublicUserEventsInput {
    PublicPaginationInput pagination = 1;
    string nickname = 2;
}

message GetPrivateUserEventsInput {
    ValidateInput validation = 1;
    PrivatePaginationInput pagination = 2;
    string nickname = 3;
}

message PublicGetEventBySlugInput {
    string slug = 1;
}

message PrivateGetEventBySlugInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message CreateEventInput {
    ValidateInput validation = 1;
    string name = 2;
    optional string description = 3;
    string dateAndTime = 4;
    int32 totalPlaces = 5;
    repeated string tags = 6;
}

message PublishEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message CancelEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message FinishEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message UpdateEventDataInput {
    ValidateInput validation = 1;
    string slug = 2;
    optional string description = 3;
    optional string dateAndTime = 4;
    optional int32 totalPlaces = 5;
}

message SwitchOrganizerInput {
    ValidateInput validation = 1;
    string slug = 2;
    string organizerNickname = 3;
}

message DeleteEventInput {
    ValidateInput validation = 1;
    string slug = 2;
}

message DeleteOtherEventInput {
    ValidateInput validation = 1;
    string slug = 2;
    string message = 3;
}

// Output Messages

message PublicPaginationOutput {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
    int32 totalPages = 4;
    bool hasNext = 5;
    bool hasPrev = 6;
    optional string search = 7;
    optional string dateFrom = 8;
    optional string dateTo = 9;
    optional int32 leftPlacesFrom = 10;
    optional int32 leftPlacesTo = 11;
    repeated string tags = 12;
}

message PrivatePaginationOutput {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
    int32 totalPages = 4;
    bool hasNext = 5;
    bool hasPrev = 6;
    optional string search = 7;
    optional string dateFrom = 8;
    optional string dateTo = 9;
    optional int32 totalPlacesFrom = 10;
    optional int32 totalPlacesTo = 11;
    optional int32 leftPlacesFrom = 12;
    optional int32 leftPlacesTo = 13;
    optional EventStatuses status = 14;
    repeated string tags = 15;
}

message EventUserShortOutput {
    string nickname = 1;
    optional string avatarId = 2;
}

message EventTagShortOutput {
    string slug = 1;
    string name = 2;
    optional string color = 3;
}

message EventListOutput {
    string slug = 1;
    string name = 2;
    string dateAndTime = 3;
    int32 leftPlaces = 4;
    int32 waitingUsers = 5;
    EventStatuses status = 6;
    EventUserShortOutput organizer = 7;
    repeated EventTagShortOutput tags = 8;
}

message EventOutput {
    string slug = 1;
    string name = 2;
    optional string description = 3;
    string dateAndTime = 4;
    int32 totalPlaces = 5;
    int32 leftPlaces = 6;
    int32 waitingUsers = 7;
    EventStatuses status = 8;
    repeated EventTagShortOutput tags = 9;
    string organizerId = 10;
    EventUserShortOutput organizer = 11;
    repeated EventUserShortOutput participants = 12;
    string createdAt = 13;
}

message EventMethodsOutput {
    string slug = 1;
    string name = 2;
    optional string description = 3;
    string dateAndTime = 4;
    int32 totalPlaces = 5;
    int32 leftPlaces = 6;
    int32 waitingUsers = 7;
    EventStatuses status = 8;
    string organizerId = 9;
}

message PaginatedPublicEventsOutput {
    PublicPaginationOutput pagination = 1;
    repeated EventListOutput events = 2;
}

message PaginatedPrivateEventsOutput {
    PrivatePaginationOutput pagination = 1;
    repeated EventListOutput events = 2;
}
