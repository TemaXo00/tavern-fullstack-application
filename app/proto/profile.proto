syntax = 'proto3';

import 'profile/profiles.proto';
import 'profile/reputation.proto';
import 'profile/activity.proto';
import 'profile/social.proto';
import "shared/shared.proto";

package profile;

service ProfileService {
    rpc GetMe(profiles.GetMeInput) returns (profiles.ProfileAdvancedOutput);
    rpc GetProfileByNicknameBase(profiles.GetProfileByNicknameBaseInput) returns (profiles.ProfileBaseOutput);
    rpc GetProfileByNicknameAdvanced(profiles.GetProfileByNicknameAdvancedInput) returns (profiles.ProfileAdvancedOutput);
    rpc GetProfilesBase(profiles.GetProfilesInput) returns (profiles.PaginatedProfilesBaseOutput);
    rpc GetProfilesAdvanced(profiles.GetProfilesAdvancedInput) returns (profiles.PaginatedProfilesAdvancedOutput);
    rpc UpdateProfile(profiles.UpdateProfileInput) returns (profiles.ProfileAdvancedOutput);
}

service ReputationService {
    rpc GetMyLogs(reputation.GetMyReputationInput) returns (reputation.PaginatedReputationOutput);
    rpc GetReputationByNickname(reputation.GetReputationByNicknameInput) returns (reputation.PaginatedReputationOutput);
    rpc AddReputation(reputation.AddReputationInput) returns (reputation.ReputationOutput);
}

service ActivityService {
    rpc GetMyLogs(activity.GetMyActivityInput) returns (activity.PaginatedActivityOutput);
    rpc GetActivityByNickname(activity.GetActivityByNicknameInput) returns (activity.PaginatedActivityOutput);
}

service SocialService {
    rpc GetMySocials(social.GetMySocialsInput) returns (social.AllSocialsOutput);
    rpc GetSocialsByNickname(social.GetOtherUserSocialsOutput) returns (social.AllSocialsOutput);
    rpc CreateSocial(social.CreateSocialInput) returns (social.SocialOutput);
    rpc DeleteSocial(social.DeleteSocialInput) returns (shared.Empty);

}
