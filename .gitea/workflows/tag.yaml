name: Build Docker Images (Tag)

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Push Docker Images
        run: |
          ./scripts/docker.build-and-push.sh ${{ secrets.DOCKER_REGISTRY }} latest ${{ github.ref_name }}
