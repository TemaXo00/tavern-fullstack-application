name: Build Docker Images (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "dev"
      ref:
        description: "Branch or commit SHA"
        required: true
        default: "dev"

jobs:
  build:
    runs-on: system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build AUTH Microservice
        run: docker build -f docker-files/Auth.Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-auth:${{ inputs.tag }} ./app

      - name: Push AUTH Microservice
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-auth:${{ inputs.tag }}

      - name: Build PROFILE Microservice
        run: docker build -f docker-files/Profile.Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-profile:${{ inputs.tag }} ./app

      - name: Push PROFILE Microservice
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-profile:${{ inputs.tag }}

      - name: Build EVENT Microservice
        run: docker build -f docker-files/Event.Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-event:${{ inputs.tag }} ./app

      - name: Push EVENT Microservice
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-event:${{ inputs.tag }}

      - name: Build DB Migrator
        run: docker build -f docker-files/Db-Migrator.Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-migrator:${{ inputs.tag }} .

      - name: Push DB Migrator
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-migrator:${{ inputs.tag }}

      - name: Build API GATEWAY
        run: docker build -f docker-files/Gateway.Dockerfile -t ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-gateway:${{ inputs.tag }} ./app

      - name: Push API GATEWAY
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/temaxo00/tavern-gateway:${{ inputs.tag }}
