name: "Check code style"

on:
  push:
    branches:
      - "*"

jobs:
  check:
    runs-on: system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ESLint
        run: cd app && npx --yes eslint@9.8.0 . --max-warnings 0

      - name: Check Prettier
        run: cd app && npx --yes prettier@3.8.1 --check .
