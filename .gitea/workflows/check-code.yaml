name: "Check code style"

on:
  push:
    branches:
      - "**"

jobs:
  check:
    runs-on: system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: cd app && npm ci

      - name: Generate Database Models
        run: |
          cd app &&
          npm run auth-db:generate &&
          npm run profile-db:generate &&
          npm run event-db:generate

      - name: Check ESLint
        run: cd app && npm run all:lint

      - name: Check Types
        run: cd app && npm run all:typecheck

      - name: Check Prettier
        run: cd app && npx prettier --check .
