name: Build Docker Images (Dev)

on:
  push:
    branches: ["dev"]

jobs:
  build:
    runs-on: system

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Push Docker Images
        run: |
          ./scripts/docker.build-and-push.sh ${{ secrets.DOCKER_REGISTRY }} dev
