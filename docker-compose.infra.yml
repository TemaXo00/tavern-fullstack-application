services:
  rabbitmq-infra:
    image: rabbitmq:4.3.6-alpine
    container_name: tavern-infra-rmq
    ports:
      - "${TAVERN_INFRA_RMQ_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${TAVERN_INFRA_RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TAVERN_INFRA_RMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-infra:
    image: redis:8.10.2-alpine
    container_name: tavern-infra-redis
    ports:
      - "${TAVERN_INFRA_REDIS_PORT}:6379"
    volumes:
      - redis_infra_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
      --requirepass ${TAVERN_INFRA_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db-infra:
    image: postgres:18.6-alpine
    container_name: tavern-infra-auth-db
    environment:
      POSTGRES_DB: ${TAVERN_INFRA_AUTH_DB_NAME}
      POSTGRES_USER: ${TAVERN_INFRA_AUTH_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_INFRA_AUTH_DB_PASSWORD}
    ports:
      - "${TAVERN_INFRA_AUTH_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_INFRA_AUTH_DB_USER} -d ${TAVERN_INFRA_AUTH_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_infra_data:/var/lib/postgresql

  profile-db-infra:
    image: postgres:18.6-alpine
    container_name: tavern-infra-profile-db
    environment:
      POSTGRES_DB: ${TAVERN_INFRA_PROFILE_DB_NAME}
      POSTGRES_USER: ${TAVERN_INFRA_PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_INFRA_PROFILE_DB_PASSWORD}
    ports:
      - "${TAVERN_INFRA_PROFILE_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_INFRA_PROFILE_DB_USER} -d ${TAVERN_INFRA_PROFILE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - profile_db_infra_data:/var/lib/postgresql

  event-db-infra:
    image: postgres:18.6-alpine
    container_name: tavern-infra-event-db
    environment:
      POSTGRES_DB: ${TAVERN_INFRA_EVENT_DB_NAME}
      POSTGRES_USER: ${TAVERN_INFRA_EVENT_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_INFRA_EVENT_DB_PASSWORD}
    ports:
      - "${TAVERN_INFRA_EVENT_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_INFRA_EVENT_DB_USER} -d ${TAVERN_INFRA_EVENT_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - event_db_infra_data:/var/lib/postgresql

  blog-db-infra:
    image: postgres:18.6-alpine
    container_name: tavern-infra-blog-db
    environment:
      POSTGRES_DB: ${TAVERN_INFRA_BLOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_INFRA_BLOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_INFRA_BLOG_DB_PASSWORD}
    ports:
      - "${TAVERN_INFRA_BLOG_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_INFRA_BLOG_DB_USER} -d ${TAVERN_INFRA_BLOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - blog_db_infra_data:/var/lib/postgresql

  log-db-infra:
    image: postgres:18.6-alpine
    container_name: tavern-infra-log-db
    environment:
      POSTGRES_DB: ${TAVERN_INFRA_LOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_INFRA_LOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_INFRA_LOG_DB_PASSWORD}
    ports:
      - "${TAVERN_INFRA_LOG_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_INFRA_LOG_DB_USER} -d ${TAVERN_INFRA_LOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - log_db_infra_data:/var/lib/postgresql

  db_migrator-infra:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-migrator:${DOCKER_APPS_DEV_VERSION}
    container_name: tavern-infra-database-migrator
    environment:
      TAVERN_AUTH_DB_URL: ${TAVERN_INFRA_AUTH_DB_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_INFRA_PROFILE_DB_URL}
      TAVERN_EVENT_DB_URL: ${TAVERN_INFRA_EVENT_DB_URL}
      TAVERN_BLOG_DB_URL: ${TAVERN_INFRA_BLOG_DB_URL}
      TAVERN_LOG_DB_URL: ${TAVERN_INFRA_LOG_DB_URL}
    depends_on:
      auth-db-infra:
        condition: service_healthy
      profile-db-infra:
        condition: service_healthy
      event-db-infra:
        condition: service_healthy
      blog-db-infra:
        condition: service_healthy
      log-db-infra:
        condition: service_healthy
    restart: "no"

  mailpit-infra:
    image: axllent/mailpit:latest
    container_name: tavern-infra-mailpit
    restart: unless-stopped
    ports:
      - "${TAVERN_INFRA_MAILPIT_UI_PORT}:8025"
      - "${TAVERN_INFRA_MAILPIT_TRANSPORT_PORT}:1025"
    volumes:
      - mailpit_infra_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  redis_infra_data:
  auth_db_infra_data:
  profile_db_infra_data:
  event_db_infra_data:
  blog_db_infra_data:
  log_db_infra_data:
  mailpit_infra_data:
