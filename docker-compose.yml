services:
  rabbitmq-dev:
    image: rabbitmq:4.3.6-alpine
    container_name: tavern-dev-rmq
    networks:
      - tavern-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${TAVERN_RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TAVERN_RMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq

  redis-dev:
    image: redis:8.10.2-alpine
    container_name: tavern-dev-redis
    networks:
      - tavern-dev
    volumes:
      - redis_dev_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
      --requirepass ${TAVERN_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TAVERN_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db-dev:
    image: postgres:18.6-alpine
    container_name: tavern-dev-auth-db
    networks:
      - tavern-dev
    environment:
      POSTGRES_DB: ${TAVERN_AUTH_DB_NAME}
      POSTGRES_USER: ${TAVERN_AUTH_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_AUTH_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_AUTH_DB_USER} -d ${TAVERN_AUTH_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_dev_data:/var/lib/postgresql

  profile-db-dev:
    image: postgres:18.6-alpine
    container_name: tavern-dev-profile-db
    networks:
      - tavern-dev
    environment:
      POSTGRES_DB: ${TAVERN_PROFILE_DB_NAME}
      POSTGRES_USER: ${TAVERN_PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_PROFILE_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_PROFILE_DB_USER} -d ${TAVERN_PROFILE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - profile_db_dev_data:/var/lib/postgresql

  event-db-dev:
    image: postgres:18.6-alpine
    container_name: tavern-dev-event-db
    networks:
      - tavern-dev
    environment:
      POSTGRES_DB: ${TAVERN_EVENT_DB_NAME}
      POSTGRES_USER: ${TAVERN_EVENT_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_EVENT_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_EVENT_DB_USER} -d ${TAVERN_EVENT_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - event_db_dev_data:/var/lib/postgresql

  blog-db-dev:
    image: postgres:18.6-alpine
    container_name: tavern-dev-blog-db
    environment:
      POSTGRES_DB: ${TAVERN_BLOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_BLOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_BLOG_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_BLOG_DB_USER} -d ${TAVERN_BLOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - blog_db_dev_data:/var/lib/postrgesql

  log-db-dev:
    image: postgres:18.6-alpine
    container_name: tavern-dev-log-db
    environment:
      POSTGRES_DB: ${TAVERN_LOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_LOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_LOG_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_LOG_DB_USER} -d ${TAVERN_LOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - log_db_dev_data:/var/lib/postrgesql

  auth-service-dev:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-auth:${DOCKER_APPS_VERSION}
    container_name: tavern-dev-auth-api
    networks:
      - tavern-dev
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_DEV_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_DEV_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_DEV_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_PROFILE_CACHE_TTL: ${TAVERN_PROFILE_CACHE_TTL}
    depends_on:
      auth-db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy

  profile-service-dev:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-profile:${DOCKER_APPS_VERSION}
    container_name: tavern-dev-profile-api
    networks:
      - tavern-dev
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_DEV_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_DEV_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_DEV_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_DEV_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_REPUTATION_SCORE_EVENT: ${TAVERN_REPUTATION_SCORE_EVENT}
      TAVERN_REPUTATION_SCORE_BLOCK: ${TAVERN_REPUTATION_SCORE_BLOCK}
      TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK: ${TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK}
      TAVERN_REPUTATION_SCORE_REPORT: ${TAVERN_REPUTATION_SCORE_REPORT}
      TAVERN_PROFILE_CACHE_TTL: ${TAVERN_PROFILE_CACHE_TTL}
    depends_on:
      auth-service-dev:
        condition: service_started
      auth-db-dev:
        condition: service_healthy
      profile-db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy

  event-service-dev:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-event:${DOCKER_APPS_VERSION}
    container_name: tavern-dev-event-api
    networks:
      - tavern-dev
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_DEV_URL}
      TAVERN_EVENT_DB_URL: ${TAVERN_EVENT_DB_DEV_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_DEV_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_DEV_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_EVENT_TAG_CACHE_TTL: ${TAVERN_EVENT_TAG_CACHE_TTL}
      TAVERN_EVENT_CACHE_TTL: ${TAVERN_EVENT_CACHE_TTL}
      TAVERN_EVENT_USERPAGE_TTL: ${TAVERN_EVENT_USERPAGE_TTL}
    depends_on:
      auth-service-dev:
        condition: service_started
      auth-db-dev:
        condition: service_healthy
      event-db-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy

  gateway-dev:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-gateway:${DOCKER_APPS_VERSION}
    container_name: tavern-dev-gateway-api
    ports:
      - "${TAVERN_API_PORT}:${TAVERN_API_PORT}"
    networks:
      - tavern-dev
    environment:
      APPS_GLOBAL_SCOPE: "TAVERN"
      TAVERN_DEV_MODE: true
      TAVERN_GATEWAY_HTTP_PORT: ${TAVERN_API_PORT}
      TAVERN_GATEWAY_CORS_ORIGINS: ${TAVERN_ALLOWED_ORIGINS}
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_DEV_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_DEV_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_DEV_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_AUTH_GRPC_URL: ${TAVERN_AUTH_GRPC_DEV_URL}
      TAVERN_PROFILE_GRPC_URL: ${TAVERN_PROFILE_GRPC_DEV_URL}
      TAVERN_EVENT_GRPC_URL: ${TAVERN_EVENT_GRPC_DEV_URL}
    depends_on:
      auth-service-dev:
        condition: service_started
      profile-service-dev:
        condition: service_started
      event-service-dev:
        condition: service_started
      redis-dev:
        condition: service_healthy
      auth-db-dev:
        condition: service_healthy

  db_migrator-dev:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-migrator:${DOCKER_APPS_VERSION}
    container_name: tavern-dev-database-migrator
    networks:
      - tavern-dev
    environment:
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_DEV_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_DEV_URL}
      TAVERN_EVENT_DB_URL: ${TAVERN_EVENT_DB_DEV_URL}
      TAVERN_BLOG_DB_URL: ${TAVERN_BLOG_DB_DEV_URL}
      TAVERN_LOG_DB_URL: ${TAVERN_LOG_DB_DEV_URL}
    depends_on:
      auth-db-dev:
        condition: service_healthy
      profile-db-dev:
        condition: service_healthy
      event-db-dev:
        condition: service_healthy
    restart: "no"

volumes:
  redis_dev_data:
  rabbitmq_dev_data:
  auth_db_dev_data:
  profile_db_dev_data:
  event_db_dev_data:
  blog_db_dev_data:
  log_db_dev_data:

networks:
  tavern-dev:
    driver: bridge
