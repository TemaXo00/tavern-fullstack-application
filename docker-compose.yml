services:
  rabbitmq:
    image: rabbitmq:4.3.6-alpine
    container_name: tavern-rmq
    networks:
      - tavern
    environment:
      RABBITMQ_DEFAULT_USER: ${TAVERN_RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TAVERN_RMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:8.10.2-alpine
    container_name: tavern-redis
    networks:
      - tavern
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
      --requirepass ${TAVERN_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TAVERN_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18.6-alpine
    container_name: tavern-auth-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_AUTH_DB_NAME}
      POSTGRES_USER: ${TAVERN_AUTH_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_AUTH_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_AUTH_DB_USER} -d ${TAVERN_AUTH_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_data:/var/lib/postgresql

  profile-db:
    image: postgres:18.6-alpine
    container_name: tavern-profile-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_PROFILE_DB_NAME}
      POSTGRES_USER: ${TAVERN_PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_PROFILE_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_PROFILE_DB_USER} -d ${TAVERN_PROFILE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - profile_db_data:/var/lib/postgresql

  event-db:
    image: postgres:18.6-alpine
    container_name: tavern-event-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_EVENT_DB_NAME}
      POSTGRES_USER: ${TAVERN_EVENT_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_EVENT_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_EVENT_DB_USER} -d ${TAVERN_EVENT_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - event_db_data:/var/lib/postgresql

  blog-db:
    image: postgres:18.6-alpine
    container_name: tavern-blog-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_BLOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_BLOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_BLOG_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_BLOG_DB_USER} -d ${TAVERN_BLOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - blog_db_data:/var/lib/postgresql

  log-db:
    image: postgres:18.6-alpine
    container_name: tavern-log-db
    networks:
      - tavern
    environment:
      POSTGRES_DB: ${TAVERN_LOG_DB_NAME}
      POSTGRES_USER: ${TAVERN_LOG_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_LOG_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TAVERN_LOG_DB_USER} -d ${TAVERN_LOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - log_db_data:/var/lib/postgresql

  auth-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-auth:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-auth-api
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_PROFILE_CACHE_TTL: ${TAVERN_PROFILE_CACHE_TTL}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  profile-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-profile:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-profile-api
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_REPUTATION_SCORE_EVENT: ${TAVERN_REPUTATION_SCORE_EVENT}
      TAVERN_REPUTATION_SCORE_BLOCK: ${TAVERN_REPUTATION_SCORE_BLOCK}
      TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK: ${TAVERN_REPUTATION_SCORE_EARLY_UNBLOCK}
      TAVERN_REPUTATION_SCORE_REPORT: ${TAVERN_REPUTATION_SCORE_REPORT}
      TAVERN_PROFILE_CACHE_TTL: ${TAVERN_PROFILE_CACHE_TTL}
      TAVERN_SOCIALS_MAX_COUNT: ${TAVERN_SOCIALS_MAX_COUNT}
    depends_on:
      auth-service:
        condition: service_started
      auth-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mail-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-mail:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-mail-api
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_MAIL_FROM: ${TAVERN_MAIL_FROM}
      TAVERN_MAIL_TRANSPORT_HOST: ${TAVERN_MAIL_TRANSPORT_HOST}
      TAVERN_MAIL_TRANSPORT_PORT: ${TAVERN_MAIL_TRANSPORT_PORT}
      TAVERN_MAIL_SECURE_ENABLE: ${TAVERN_MAIL_SECURE_ENABLE}
      TAVERN_MAIL_USER: ${TAVERN_MAIL_USER}
      TAVERN_MAIL_PASSWORD: ${TAVERN_MAIL_PASSWORD}
      TAVERN_WEB_CLIENT_LINK: ${TAVERN_WEB_CLIENT_LINK}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
    networks:
      - tavern
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  event-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-event:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-event-api
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_EVENT_DB_URL: ${TAVERN_EVENT_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_EVENT_TAG_CACHE_TTL: ${TAVERN_EVENT_TAG_CACHE_TTL}
      TAVERN_EVENT_CACHE_TTL: ${TAVERN_EVENT_CACHE_TTL}
      TAVERN_EVENT_USERPAGE_TTL: ${TAVERN_EVENT_USERPAGE_TTL}
    depends_on:
      auth-service:
        condition: service_started
      auth-db:
        condition: service_healthy
      event-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  blog-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-blog:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-blog-api
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_BLOG_DB_URL: ${TAVERN_BLOG_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_BLOG_TAG_CACHE_TTL: ${TAVERN_BLOG_TAG_CACHE_TTL}
      TAVERN_BLOG_ARTICLE_CACHE_TTL: ${TAVERN_BLOG_ARTICLE_CACHE_TTL}
    depends_on:
      auth-service:
        condition: service_started
      auth-db:
        condition: service_healthy
      blog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  log-service:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-log:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-log-api
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_LOG_DB_URL: ${TAVERN_LOG_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
    depends_on:
      auth-service:
        condition: service_started
      auth-db:
        condition: service_healthy
      log-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-gateway:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-gateway-api
    ports:
      - "${TAVERN_API_PORT}:${TAVERN_API_PORT}"
    networks:
      - tavern
    environment:
      TAVERN_DEV_MODE: false
      TAVERN_GATEWAY_HTTP_PORT: ${TAVERN_API_PORT}
      TAVERN_GATEWAY_CORS_ORIGINS: ${TAVERN_ALLOWED_ORIGINS}
      TAVERN_JWT_SECRET: ${TAVERN_JWT_SECRET}
      TAVERN_JWT_ACCESS_TOKEN_TTL: ${TAVERN_JWT_ACCESS_TOKEN_TTL}
      TAVERN_JWT_REFRESH_TOKEN_TTL: ${TAVERN_JWT_REFRESH_TOKEN_TTL}
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_RMQ_USER: ${TAVERN_RMQ_USER}
      TAVERN_RMQ_PASSWORD: ${TAVERN_RMQ_PASSWORD}
      TAVERN_RMQ_URL: ${TAVERN_RMQ_URL}
      TAVERN_REDIS_URL: ${TAVERN_REDIS_URL}
      TAVERN_REDIS_PASSWORD: ${TAVERN_REDIS_PASSWORD}
      TAVERN_AUTH_GRPC_URL: ${TAVERN_AUTH_GRPC_URL}
      TAVERN_PROFILE_GRPC_URL: ${TAVERN_PROFILE_GRPC_URL}
      TAVERN_EVENT_GRPC_URL: ${TAVERN_EVENT_GRPC_URL}
      TAVERN_BLOG_GRPC_URL: ${TAVERN_BLOG_GRPC_URL}
      TAVERN_LOG_GRPC_URL: ${TAVERN_LOG_GRPC_URL}
    depends_on:
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      event-service:
        condition: service_started
      blog-service:
        condition: service_started
      log-service:
        condition: service_started
      redis:
        condition: service_healthy
      auth-db:
        condition: service_healthy

  db_migrator:
    image: ${DOCKER_REGISTRY}/temaxo00/tavern-migrator:${DOCKER_APPS_PROD_VERSION}
    container_name: tavern-database-migrator
    networks:
      - tavern
    environment:
      TAVERN_AUTH_DB_URL: ${TAVERN_AUTH_DB_URL}
      TAVERN_PROFILE_DB_URL: ${TAVERN_PROFILE_DB_URL}
      TAVERN_EVENT_DB_URL: ${TAVERN_EVENT_DB_URL}
      TAVERN_BLOG_DB_URL: ${TAVERN_BLOG_DB_URL}
      TAVERN_LOG_DB_URL: ${TAVERN_LOG_DB_URL}
    depends_on:
      auth-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
      event-db:
        condition: service_healthy
      blog-db:
        condition: service_healthy
      log-db:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: tavern-mailpit
    restart: unless-stopped
    networks:
      - tavern

volumes:
  redis_data:
  rabbitmq_data:
  auth_db_data:
  profile_db_data:
  event_db_data:
  blog_db_data:
  log_db_data:

networks:
  tavern:
    driver: bridge
